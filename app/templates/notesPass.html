{% extends "base.html" %}

{% block content %}
<head>
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>

    <div class="page-heading">
      <div>
        <h1>Notas</h1>
        <p>Listado de notas cifradas</p>
      </div>
    <div class="page-heading">
    <a type="button" href="{{ url_for('dashboard.get_clipboard_html') }}" style="padding: 3px; margin: 3px;" class="boton-filtro" id="filter-task-btn">
        ↩️ Volver atrás
    </a>

    </div>
  
  </div>
    <div class="translation-section">
       


    </div>
   

            <!-- Modal de Contraseña para Notas Cifradas -->
<dialog id="passwordModal" class="password-modal-dialog">
    <div class="password-modal-content">
        <div class="password-modal-header">
            <h2 class="password-modal-title">Proteger Nota</h2>
            <button type="button" class="password-modal-close-btn" aria-label="Cerrar">&times;</button>
        </div>

        <div class="password-modal-body">
            <p class="password-modal-description">Ingresa la contraseña para descifrar la nota</p>

            <form class="password-form" id="passwordForm">
                <div class="password-form-group">
                    <label class="password-form-label">Contraseña</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="passwordInput" class="password-form-input" 
                               placeholder="Escriba aquí su contraseña" required>
                        <button type="button" class="password-toggle-btn" id="togglePassword">👁</button>
                    </div>
     
                </div>

                <div class="password-form-group">
                    <label class="password-form-label">Confirmar Contraseña</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="passwordConfirmInput" class="password-form-input" 
                               placeholder="Confirma la contraseña" required>
                        <button type="button" class="password-toggle-btn" id="togglePasswordConfirm">👁</button>
                    </div>
                    <span class="password-form-help" id="confirmHelp"></span>
                </div>
            </form>
        </div>

        <div class="password-modal-footer">
            <button type="button" class="password-modal-btn password-modal-btn-cancel" id="cancelPasswordBtn">Cancelar</button>
            <button type="submit" form="passwordForm" class="password-modal-btn password-modal-btn-submit" id="submitPasswordBtn">Desbloquear</button>
        </div>
    </div>
</dialog>

  </div>


    <dialog id="notaDialogC" class="modal-dialog">
        <div class="modal-header">
            <h2 id="modalTitle">Título de la nota</h2>
            <button class="modal-close" onclick="document.getElementById('notaDialogC').close()">✕</button>
        </div>
        
        <div class="modal-content">
            <small id="modalDate" style="padding: 10px;">Fecha...</small>
            <textarea id="modalBody" cols="55" rows="50">Contenido de la nota...</textarea>
        </div>
        
        <div class="modal-footer">
            <button class="modal-btn modal-btn-secondary" onclick="document.getElementById('notaDialogC').close()">
                Cerrar
            </button>
            <button id="btnUpdNote" class="modal-btn modal-btn-primary">Editar</button>
            <button id="btnDelNoteC" class="modal-btn modal-btn-danger">Eliminar</button>
        </div>


    </dialog>



</body>
  <script src="{{ url_for('static', filename='js/notesPass.js') }}"></script>
  <script src="{{ url_for('static', filename='js/sweetalert.js') }}" defer></script>

{% endblock %}
