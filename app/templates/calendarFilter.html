<!doctype html>
<html lang="es">
{% extends "base.html" %}

{% block content %}
<head>
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<header>

    <div class="page-heading">
    <div>
        <h1>Calendario</h1>
        <p>Vista de filtros</p>
    </div>
    <div class="page-heading">

    <a type="button" href="{{ url_for('calendar.view') }}" style="padding: 3px; margin: 3px;" class="boton-filtro" id="filter-task-btn">
        ↩️ Volver al calendario
    </a>

    </div>
  
</div>




</header>


<body>

<dialog id="task-dialog">
    <form id="task-form">
        <h2 id="dialog-title">Nueva tarea</h2><br>

        <input type="hidden" id="task-id">

        <label for="task">Tarea *</label>
        <input
            type="text"
            id="task"
            maxlength="150"
            required
            placeholder="Ej. Revisar consumo"
        ><br>

        <label for="project">Proyecto *</label>
        <input
            type="text"
            id="project"
            maxlength="150"
            required
            placeholder="Nombre del proyecto"
        ><br>

        <label for="description">Descripción</label>
        <textarea
            id="description"
            rows="3"
            placeholder="Detalles de la tarea..."
        ></textarea><br>

        <label for="status">Estado</label>
        <select id="status">
            <option value="pendiente">Pendiente</option>
            <option value="en_progreso">En progreso</option>
            <option value="completada">Completada</option>
        </select><br>

        <label for="task-date">Fecha Inicio</label>
        <input type="date" id="task-date-inicio" required><br>

        <label for="task-date">Fecha Fin</label>
        <input type="date" id="task-date-fin" required><br>

        <p id="form-error" role="alert"></p>

        <div class="dialog-actions">
            <button type="button" id="cancel-btn">
                Cancelar
            </button>

            <button type="button" id="delete-btn" hidden>
                Eliminar
            </button>

            <button type="submit" id="save-btn">
                Guardar tarea
            </button>
        </div>
    </form>
</dialog>

<section class="calendar-tasks">
  <div class="calendar-tasks__filters">
    <label class="calendar-tasks__field">
      Proyecto
      <select id="filtroProyecto">
        <option value="">Todos</option>
      </select>
    </label>

    <label class="calendar-tasks__field">
      Fecha Incio
      <input type="date" id="filtroFechaInicio">
    </label>

    <label class="calendar-tasks__field">
      Fecha Fin
      <input type="date" id="filtroFechaFin">
    </label>


    <label class="calendar-tasks__field">
      Estado
      <select id="filtroEstado">
        <option value="">Todos</option>
      </select>
    </label>

    <button
      type="button"
      id="limpiarFiltros"
      class="calendar-tasks__clear"
    >
      Limpiar filtros
    </button>
  </div>

  <p id="mensajeTabla" class="calendar-tasks__message" aria-live="polite"></p>

  <div class="calendar-tasks__table-wrapper">
    <table class="calendar-tasks__table">
      <thead>
        <tr>
          <th>Tarea</th>
          <th>Proyecto</th>
          <th>Descripción</th>
          <th>Estado</th>
          <th>Fecha Inicio</th>
          <th>Fecha Fin</th>

        </tr>
      </thead>
      <tbody id="tablaTareas"></tbody>
    </table>
  </div>
</section>


<link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.1/skeleton.css"
>

<link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.1/themes/monarch/theme.css"
>

<link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.1/themes/monarch/palettes/purple.css"
>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.1/all/global.js"></script>

<script
    src="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.1/themes/monarch/global.js">
</script>
<script src="{{ url_for('static', filename='js/sweetalert.js') }}" defer></script>

<div
    id="calendar-config" 
    data-tasks-url="{{ url_for('calendar.get_tasks') }}">
</div>

<script src="{{ url_for('static', filename='js/calendarFilter.js') }}" defer></script>



</body>



{% endblock %}
</html>
