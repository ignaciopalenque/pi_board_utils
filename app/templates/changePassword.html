<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Acceso</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/app.css') }}">
    
    <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 420px;
      margin: 40px auto;
      padding: 0 16px;
    }

    label {
      display: block;
      margin-bottom: 8px;
    }

    input {
      box-sizing: border-box;
      width: 100%;
      padding: 10px;
      font: inherit;
    }

    .barra {
      display: flex;
      gap: 5px;
      margin: 10px 0 6px;
    }

    .segmento {
      height: 8px;
      flex: 1;
      border-radius: 4px;
      background: #ddd;
    }

    #mensaje {
      font-size: 0.9rem;
      margin: 0;
    }
  </style>
</head>

<body class="login-page">
 <form method="post" class="login-card">
    <input type="hidden"
           name="csrf_token"
           value="{{ csrf_token() }}">

    <h1 class="span-login">
        <span style="padding: 3px;">
            <img src="https://cdn.iconscout.com/icon/free/png-256/free-raspberry-pi-icon-svg-download-png-14548615.png"
                 width="25"
                 height="25"
                 alt="Raspberry Pi">
        </span>
        Raspberry Admin
    </h1>

    {% with mensajes = get_flashed_messages(with_categories=true) %}
    {% if mensajes %}
    {% for categoria, mensaje in mensajes %}
      <div class="alert alert-{{ categoria }}" role="alert">
        {{ mensaje }}
      </div>
        {% endfor %}
    {% endif %}
    {% endwith %}

    <p style="text-align: center;">
        Cambia la contraseña de tu cuenta
    </p>

   <label for="old_password">Contraseña actual</label>
    <input id="old_password"
           type="password"
           name="old_password"
           autocomplete="old-password"
           minlength="8"
           required>


    <label for="new_password">Nueva contraseña</label>
    <input id="new_password"
           type="password"
           name="new_password"
           autocomplete="new-password"
           minlength="8"
           required>

    <label for="confirm_password">Confirmar nueva contraseña</label>
    <input id="confirm_password"
           type="password"
           name="confirm_password"
           autocomplete="new-password"
           minlength="8"
           required>
  
  
    <p id="mensaje" aria-live="polite" style="padding: 3px;">Nivel de seguridad de la contraseña.</p>

    <div class="barra" aria-hidden="true">
    <span class="segmento"></span>
    <span class="segmento"></span>
    <span class="segmento"></span>
    <span class="segmento"></span>
    </div>

    <button type="submit" class="button button-primary">
        Cambiar contraseña
    </button>
</form>
</body>
</html>

<script>
    const campo = document.getElementById("new_password");
    const segmentos = document.querySelectorAll(".segmento");
    const mensaje = document.querySelector("#mensaje");

    campo.addEventListener("input", () => {
      const clave = campo.value;
      let puntos = 0;

      if (clave.length >= 8) puntos++;
      if (clave.length >= 12) puntos++;
      if (/[a-z]/.test(clave) && /[A-Z]/.test(clave)) puntos++;
      if (/\d/.test(clave)) puntos++;
      if (/[^a-zA-Z0-9]/.test(clave)) puntos++;

      // Se muestran como máximo cuatro segmentos.
      const nivel = Math.min(4, puntos);

      const niveles = [
        { texto: "Muy débil", color: "#d32f2f" },
        { texto: "Débil", color: "#f57c00" },
        { texto: "Aceptable", color: "#fbc02d" },
        { texto: "Fuerte", color: "#388e3c" },
        { texto: "Muy fuerte", color: "#1b5e20" }
      ];

      segmentos.forEach((segmento, i) => {
        segmento.style.background =
          i < nivel ? niveles[puntos].color : "#ddd";
      });

      mensaje.textContent = clave
        ? `Nivel: ${niveles[puntos].texto}`
        : "Escribe una contraseña.";
    });
</script>
