{% extends "base.html" %}

{% block content %}
<head>
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<section class="clipboard-section">
    <h2>Portapapeles de red</h2>
    <p id="clipboardStatus" class="status">Última actualización: cargando...</p>

    <textarea id="clipboard" placeholder="Escribe o pega aquí el contenido..." maxlength="10000"></textarea>

    <div class="clipboard-buttons">
        <button id="loadClipboardButton">
            ↻ Recargar
        </button>

        <button id="saveClipboardButton" class="primary">
            💾 Guardar
        </button>

        <button id="copyClipboardButton">
            📋 Copiar localmente
        </button>
    </div>

    <!-- Sección de traducción -->
    <div class="translation-section">
        <h3>📌 Notas</h3>
        
        <input type="text" id="notaTitle" class="notaTitle" placeholder="Escriba aquí el titulo de la nota">
        <textarea id="notaText" placeholder="Escriba aquí el contenido de la nota" class="notaText"></textarea>
        
        <button id="guardarNotaButton" style="margin-top: 10px;" class="guardarNotaButton">
            📋 Guardar nota en texto plano
        </button>

        <button id="guardarNotaCifrada" style="margin-top: 10px;" class="guardarNotaCifrada">
            🔐 Guardar nota cifrada con contraseña
        </button>
          
        <div>
            <h3 style="margin-top: 20px; border-top: 1px solid #555; padding-top:15px;">✍️Notas</h3>

            <a href="{{ url_for('clipboard.viewNotesFilter') }}" class="boton-filtro" style="padding: 4px; margin: 3px; text-align: center;">🔍 Ver notas</a>
         
            <p id="notasCount" style="color: #999;">No hay notas</p>

       
        </div>

        <div>
            <h3 style="margin-top: 20px; border-top: 1px solid #555; padding-top:15px;">🔐Notas Cifradas</h3>

            <a href="{{ url_for('clipboard.viewNotesFilterPass') }}" class="boton-filtro" style="padding: 4px; margin: 3px; text-align: center;">🔍 Ver notas</a>
         
            <p id="notasCripCount" style="color: #999;">No hay notas</p>

       
        </div>

        <!-- Modal de Contraseña para Notas Cifradas -->
<dialog id="passwordModal" class="password-modal-dialog">
    <div class="password-modal-content">
        <div class="password-modal-header">
            <h2 class="password-modal-title">Proteger Nota</h2>
            <button type="button" class="password-modal-close-btn" aria-label="Cerrar">&times;</button>
        </div>

        <div class="password-modal-body">
            <p class="password-modal-description">Ingresa una contraseña para cifrar la nota</p>

            <form class="password-form" id="passwordForm">
                <div class="password-form-group">
                    <label class="password-form-label">Contraseña</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="passwordInput" class="password-form-input" 
                               placeholder="Mínimo 8 caracteres" required>
                        <button type="button" class="password-toggle-btn" id="togglePassword">👁</button>
                    </div>
                    <div class="password-strength-indicator">
                        <div class="password-strength-bar"></div>
                        <span class="password-strength-text">Fortaleza: —</span>
                    </div>
                </div>

                <div class="password-form-group">
                    <label class="password-form-label">Confirmar Contraseña</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="passwordConfirmInput" class="password-form-input" 
                               placeholder="Confirma la contraseña" required>
                        <button type="button" class="password-toggle-btn" id="togglePasswordConfirm">👁</button>
                    </div>
                    <span class="password-form-help" id="confirmHelp"></span>
                </div>
            </form>
        </div>

        <div class="password-modal-footer">
            <button type="button" class="password-modal-btn password-modal-btn-cancel" id="cancelPasswordBtn">Cancelar</button>
            <button type="submit" form="passwordForm" class="password-modal-btn password-modal-btn-submit" id="submitPasswordBtn">Guardar Cifrada</button>
        </div>
    </div>
</dialog>


         

    </div>

</section>
    <script src="{{ url_for('static', filename='js/clipboard.js') }}"></script>
  <script src="{{ url_for('static', filename='js/sweetalert.js') }}" defer></script>


{% endblock %}
